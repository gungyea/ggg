<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<title>스트레스 펀치</title>
<meta name="description" content="사진 한 장으로 만드는 3D 스트레스 해소 게임">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body data-screen="screen-title">
<canvas id="scene"></canvas>

<!-- ============ title ============ -->
<section class="screen active" id="screen-title">
  <div class="title-card">
    <div class="logo">🥊</div>
    <h1>스트레스 펀치</h1>
    <p>사진 한 장이면 끝. 얼굴을 3D 몸에 붙여서<br>마음껏 때리고 기분 풀기.</p>
    <button class="btn primary big" id="start">시작하기</button>
    <p class="fine">사진은 이 기기 안에서만 처리되고 어디에도 업로드되지 않아요.</p>
  </div>
</section>

<!-- ============ photo ============ -->
<section class="screen" id="screen-photo">
  <div class="panel photo-panel" id="photo-step">
    <h2>1. 사진 넣기</h2>
    <p class="sub">정면을 보는 밝은 사진이 가장 잘 나와요. 얼굴은 자동으로 찾아서 맞추고, 안 되면 핀 4개로 맞춰요.</p>
    <div class="crop-wrap">
      <canvas id="crop"></canvas>
      <div class="crop-empty">
        <label class="btn primary">🖼️ 앨범에서 고르기<input type="file" id="file" accept="image/*" hidden></label>
        <label class="btn">📷 카메라로 찍기<input type="file" id="cam" accept="image/*" capture="user" hidden></label>
      </div>
    </div>
    <div class="crop-tools">
      <button class="btn icon" id="zoom-out" title="축소">－</button>
      <button class="btn icon" id="zoom-in" title="확대">＋</button>
      <button class="btn icon" id="rot-l" title="왼쪽 회전">⟲</button>
      <button class="btn icon" id="rot-r" title="오른쪽 회전">⟳</button>
      <label class="btn small">다른 사진<input type="file" id="file2" accept="image/*" hidden></label>
    </div>
    <p class="fit-status" id="fit-status"></p>
    <p class="hint"><button class="link" id="pin-fit" hidden>얼굴이 어긋났나요? 직접 맞추기</button><button class="link" id="auto-fit" hidden>자동 맞춤으로 되돌리기</button> 핀은 끌어서, 사진은 빈 곳을 끌거나 두 손가락으로 움직여요</p>
    <div class="row">
      <button class="btn ghost" id="photo-skip">사진 없이 하기</button>
      <button class="btn primary" id="photo-next">다음 →</button>
    </div>
  </div>
</section>

<!-- ============ customize ============ -->
<section class="screen" id="screen-custom">
  <div class="panel custom-panel">
    <h2>2. 몸 만들기</h2>
    <div class="field">
      <label>성별</label>
      <div class="seg" id="gender"><button data-g="male" class="on">남자</button><button data-g="female">여자</button></div>
    </div>
    <div class="field">
      <label>키 <output id="v-height"></output></label>
      <input type="range" id="s-height" min="100" max="220" step="1">
    </div>
    <div class="field">
      <label>몸무게 <output id="v-weight"></output></label>
      <input type="range" id="s-weight" min="30" max="200" step="1">
      <small id="v-bmi" class="muted"></small>
    </div>
    <div class="field">
      <label>근육 <output id="v-muscle"></output></label>
      <input type="range" id="s-muscle" min="0" max="100" step="1">
    </div>
    <div class="field">
      <label>머리 크기 <output id="v-head"></output></label>
      <input type="range" id="s-head" min="80" max="160" step="1">
    </div>
    <div class="field">
      <label>머리카락</label>
      <div class="chips" id="hair"></div>
    </div>
    <div class="field">
      <label>옷</label>
      <div class="outfits" id="outfits"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="custom-back">← 사진</button>
      <button class="btn primary" id="custom-go">때리러 가기 🥊</button>
    </div>
  </div>
</section>

<!-- ============ play ============ -->
<section class="screen" id="screen-play">
  <div class="hud-top">
    <div class="stress" id="stress"><span>스트레스</span><div class="bar"><i></i></div><b>100%</b></div>
    <div class="hud-btns">
      <button class="btn icon" id="btn-sound" title="소리">🔊</button>
      <button class="btn icon" id="btn-clean" title="닦기">🧽</button>
      <button class="btn icon" id="btn-reset" title="일으키기">🧍</button>
      <button class="btn icon" id="btn-body" title="몸 바꾸기">⚙️</button>
    </div>
  </div>
  <div class="hits">타격 <b id="hits">0</b></div>
  <div class="combo" id="combo"></div>
  <div class="cam-btns"><button class="btn icon" id="cam-l">◀</button><button class="btn icon" id="cam-r">▶</button></div>
  <div class="charge" id="charge"><i></i></div>
  <div class="toolbar" id="toolbar"></div>
</section>

<div id="pops"></div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div><span id="loading-text">3D 몸 만드는 중…</span><button class="btn small" id="loading-cancel" hidden>기다리지 않고 직접 맞추기</button></div>

<div id="result">
  <div class="result-card">
    <div class="big-emoji">😌</div>
    <h2>스트레스 0%</h2>
    <p>속이 좀 시원해졌나요?</p>
    <div class="stats">
      <div><b id="r-hits">0</b><span>타격</span></div>
      <div><b id="r-combo">0</b><span>최대 콤보</span></div>
      <div><b id="r-time">0</b><span>걸린 시간</span></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="r-new">다른 사람</button>
      <button class="btn primary" id="r-again">계속 패기</button>
    </div>
  </div>
</div>

<noscript>이 게임은 자바스크립트가 필요해요.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
